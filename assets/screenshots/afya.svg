    <text x="300" y="28" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#888" text-anchor="middle">afya-wellness.co.ke</text>
    
    <!-- Hero Mockup Inside Browser -->
    <rect x="0" y="48" width="600" height="392" fill="#FFF8F4" />
    
    <!-- Top Nav -->
    <text x="36" y="82" font-family="'Playfair Display', Georgia, serif" font-size="18" font-weight="700" fill="#006A3E">Afya</text>
    <text x="380" y="80" font-family="-apple-system, sans-serif" font-size="11" fill="#6F7A70">Bakery • Clinical • Recipes</text>
    <rect x="500" y="68" width="68" height="24" rx="12" fill="#006A3E" />
    <text x="534" y="83" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#FFF" text-anchor="middle">Order</text>
    
    <!-- Hero Headline -->
    <text x="36" y="145" font-family="'Playfair Display', Georgia, serif" font-size="30" font-weight="600" fill="#1E1B18">Food as medicine,</text>
    <text x="36" y="180" font-family="'Playfair Display', Georgia, serif" font-size="30" font-weight="600" fill="#006A3E" font-style="italic">crafted for vitality.</text>
    <text x="36" y="215" font-family="-apple-system, sans-serif" font-size="12" fill="#6F7A70" width="300">Therapeutic nutrition, artisanal bakery &amp; functional medicine.</text>
    
    <!-- CTA Button -->
    <rect x="36" y="240" width="130" height="34" rx="17" fill="#006A3E" />
    <text x="101" y="261" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#FFF" text-anchor="middle">Explore Plans →</text>
    
    <!-- Product Cards -->
    <g transform="translate(36, 305)">
      <rect width="160" height="100" rx="8" fill="#FFFFFF" stroke="#E8E1DC" />
      <rect x="12" y="12" width="136" height="45" rx="4" fill="#C0EDD2" opacity="0.4" />
      <text x="12" y="74" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#1E1B18">Sourdough Loaf</text>
      <text x="12" y="90" font-family="-apple-system, sans-serif" font-size="10" fill="#006A3E">KES 650</text>
