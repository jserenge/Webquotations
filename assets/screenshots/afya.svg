      <rect x="16" y="16" width="148" height="150" rx="6" fill="#F4ECE7" />
      <text x="90" y="100" font-family="'Playfair Display', Georgia, serif" font-size="16" fill="#006A3E" text-anchor="middle">Artisanal Bakery</text>
