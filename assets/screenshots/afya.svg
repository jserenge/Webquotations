      <rect x="12" y="12" width="136" height="45" rx="4" fill="#D1E8D7" opacity="0.5" />
      <text x="12" y="74" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#1E1B18">Clinical Gut Protocol</text>
      <text x="12" y="90" font-family="-apple-system, sans-serif" font-size="10" fill="#006A3E">KES 8,500</text>
