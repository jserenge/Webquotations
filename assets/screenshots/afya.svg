<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4ECE7" />
      <stop offset="100%" stop-color="#E8E1DC" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#006A3E" />
      <stop offset="100%" stop-color="#004D2C" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#1E1B18" flood-opacity="0.12" />
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)" />
  <!-- Editorial Grid Lines -->
  <line x1="60" y1="0" x2="60" y2="600" stroke="#DDD6D0" stroke-width="1" />
  <line x1="740" y1="0" x2="740" y2="600" stroke="#DDD6D0" stroke-width="1" />
  
  <!-- Browser Chrome Mockup -->
  <g transform="translate(100, 80)" filter="url(#shadow)">
    <rect width="600" height="440" rx="12" fill="#FFFFFF" />
    <path d="M 0 12 Q 0 0 12 0 L 588 0 Q 600 0 600 12 L 600 48 L 0 48 Z" fill="#FDFBF9" stroke="#EFEBE7" stroke-width="1" />
    <circle cx="28" cy="24" r="5" fill="#E8B4B8" />
    <circle cx="44" cy="24" r="5" fill="#E6D3A3" />
    <circle cx="60" cy="24" r="5" fill="#A7D7C5" />
